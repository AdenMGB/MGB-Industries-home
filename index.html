<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Redirect www to canonical non-www to fix "Duplicate, Google chose different canonical than user" -->
    <script>
      if (window.location.hostname === 'www.adenmgb.com') {
        window.location.replace(
          'https://adenmgb.com' +
            window.location.pathname +
            window.location.search +
            window.location.hash,
        )
      }
    </script>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AdenMGB — Open source developer & a quiet shop of carefully crafted utilities." />
    <meta name="theme-color" content="#FDFBF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)" />
    <title>AdenMGB | Carefully Crafted Utilities</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AdenMGB" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Canonical - overwritten per-page by JS -->
    <link rel="canonical" href="https://adenmgb.com/" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
